# MautVim's bundled terminal config — tuned for Neovim + Yazi.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        14.0

window_padding_width      8
hide_window_decorations   titlebar-only
macos_option_as_alt       yes
macos_quit_when_last_window_closed yes
confirm_os_window_close   0
enable_audio_bell         no
scrollback_lines          10000
cursor_blink_interval     0
tab_bar_style             hidden
# image previews (Yazi) use kitty's graphics protocol — on by default

# ── tokyonight night ───────────────────────────────────────────────
foreground            #c0caf5
background            #1a1b26
selection_foreground  none
selection_background  #283457
cursor                #c0caf5
cursor_text_color     #1a1b26
url_color             #73daca

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
